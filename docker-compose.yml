services:
  codeatlas:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - codeatlas_data:/data
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-2
        awslogs-group: codeatlas
        awslogs-create-group: "true"

volumes:
  codeatlas_data: