[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeatlas"
version = "0.1.0"
description = "Repository onboarding and code intelligence platform"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]
